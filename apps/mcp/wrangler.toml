name = "read-mcp"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "YOUR_CLOUDFLARE_ACCOUNT_ID"
workers_dev = false

routes = [{ pattern = "read-mcp.lolwierd.com", custom_domain = true }]

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "read-db"
database_id = "1845379c-c0bb-45b1-b537-aabe275b1372"
migrations_dir = "../../migrations"

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "5b43be6ca562428297a34de54f3c8542"

# Secrets (set via `wrangler secret put`): GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
# ALLOWED_EMAIL, INGEST_TOKEN
